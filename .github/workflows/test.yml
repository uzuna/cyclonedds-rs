name: Build for Tests

on:
  workflow_call:

jobs:
  build-cyclonedds:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify vendored Cyclone DDS
        env:
          CYCLONEDDS_VERSION: 11.0.0
        run: |
          expected_sha=$(git ls-tree "$GITHUB_SHA" vendor/cyclonedds | awk '{print $3}')
          actual_sha=$(git -C vendor/cyclonedds rev-parse HEAD)
          test "$actual_sha" = "$expected_sha"
          grep -F "project(CycloneDDS VERSION $CYCLONEDDS_VERSION" vendor/cyclonedds/CMakeLists.txt
      - id: rust-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("Cargo.toml", "rb") as cargo_toml:
              print(f"toolchain={tomllib.load(cargo_toml)['workspace']['package']['rust-version']}")
          PY
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.toolchain }}
          components: rustfmt, clippy
      - name: Cache debian packages
        id: cache-deb
        uses: actions/cache@v4
        with:
          path: ./deb/*.deb
          key: deb-v2-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('common.mk', 'vendor/Makefile', 'vendor/debian/**', 'vendor/config/**', 'vendor/cyclonedds/**', 'vendor/iceoryx/**') }}

      - uses: taiki-e/install-action@v2
        if: steps.cache-deb.outputs.cache-hit != 'true'
        with:
          tool: cargo-deb
      - name: Build deb package
        if: steps.cache-deb.outputs.cache-hit != 'true'
        run: |
          make -C vendor/ setup
          make -C vendor/debian deb

      - name: Install dependencies
        run: sudo dpkg -i ./deb/*.deb

      - name: run fmt
        run: make check-fmt

      - name: run tests
        run: make test

      - name: run PSMX shared-memory integration
        if: matrix.os == 'ubuntu-24.04'
        run: make BENCH_RUN_ID="ci-${{ github.run_id }}-${{ github.run_attempt }}" test-local-shm
