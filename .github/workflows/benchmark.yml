name: Benchmark

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-actions:
    uses: ./.github/workflows/actions-lint.yml

  tests:
    uses: ./.github/workflows/test.yml

  benchmark:
    needs: [check-actions, tests]
    runs-on: ubuntu-24.04-arm
    env:
      BENCH_RUN_ID: github-${{ github.run_id }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Cache debian packages
        id: cache-deb
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./deb/*.deb
          key: deb-v2-ubuntu-24.04-arm-arm64-${{ hashFiles('vendor/Makefile', 'vendor/debian/Makefile', 'vendor/debian/Cargo-template.toml') }}
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        if: steps.cache-deb.outputs.cache-hit != 'true'
        with:
          tool: cargo-deb
      - name: Build deb package
        if: steps.cache-deb.outputs.cache-hit != 'true'
        run: |
          make -C vendor/ setup
          make -C vendor/debian deb
      - name: Install dependencies
        run: sudo dpkg -i ./deb/*.deb
      - name: Build benchmark
        run: cargo build --release -p cyclonedds-bench
      - name: Run benchmark cases
        run: make BENCH_RUN_ID="$BENCH_RUN_ID" test-local-all
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-${{ github.run_id }}
          path: target/bench-results/${{ env.BENCH_RUN_ID }}
          if-no-files-found: warn

  build-site:
    needs: benchmark
    runs-on: ubuntu-latest
    env:
      BENCH_RUN_ID: github-${{ github.run_id }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read benchmark commit message
        run: |
          {
            echo 'BENCH_COMMIT_MESSAGE<<EOF'
            git log -1 --pretty=%B
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-results-${{ github.run_id }}
          path: bench-results
      - name: Restore benchmark site
        run: |
          mkdir -p site
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git archive FETCH_HEAD | tar -x -C site
          fi
      - name: Build benchmark site
        run: |
          INPUT_DIR=bench-results
          if [ ! -f "$INPUT_DIR/metadata.json" ]; then
            INPUT_DIR="$(dirname "$(find "$INPUT_DIR" -name metadata.json -print -quit)")"
          fi
          BENCH_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BENCH_ARTIFACT_URL="$BENCH_RUN_URL#artifacts"
          BENCH_COMMIT_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          python3 scripts/bench_site.py \
            --input-dir "$INPUT_DIR" \
            --site-dir site \
            --commit "$GITHUB_SHA" \
            --commit-message "$BENCH_COMMIT_MESSAGE" \
            --run-id "$BENCH_RUN_ID" \
            --run-url "$BENCH_RUN_URL" \
            --artifact-url "$BENCH_ARTIFACT_URL" \
            --commit-url "$BENCH_COMMIT_URL"
      - name: Upload benchmark site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-site-${{ github.run_id }}
          path: site

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-site-${{ github.run_id }}
          path: site
      - name: Publish benchmark site
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: true
          enable_jekyll: false
