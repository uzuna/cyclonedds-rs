[workspace]
members = ["cyclonedds", "cyclonedds-sys", "dds_derive"]
resolver = "2"

[workspace.package]
edition = "2024"
description = "Rust bindings for cyclonedds autogenerated by bindgen"
homepage = "https://github.com/uzuna/cyclonedds-sys"
license-file = "LICENSE"
rust-version = "1.95"

[workspace.dependencies]
cyclonedds-sys = { path = "cyclonedds-sys" }
cdds_derive = { path = "dds_derive" }
proc-macro2 = "1.0.107"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
