[package]
name = "__CRATE_NAME__"
version = "__CRATE_VERSION__"
edition = "2021"
publish = false
description = "Cyclone DDS with iceoryx shared-memory transport"
homepage = "__HOMEPAGE__"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[workspace]

[package.metadata.deb]
name = "__PACKAGE_NAME__"
maintainer = "__MAINTAINER__"
copyright = "__COPYRIGHT__"
section = "libs"
priority = "optional"
depends = []
extended-description = """
Shared libraries and executables for Cyclone DDS, including the psmx_iox \
PSMX plugin, together with the iceoryx RouDi daemon required for \
shared-memory transport."""
assets = [
    [
        "../iceoryx/install/bin/*",
        "usr/bin/",
        "755",
    ],
    [
        "../cyclonedds/install/bin/*",
        "usr/bin/",
        "755",
    ],
    [
        "../cyclonedds/install/lib/*.so*",
        "usr/lib/",
        "755",
    ],
]

[package.metadata.deb.variants.dev]
name = "__PACKAGE_DEV_NAME__"
depends = ["__PACKAGE_NAME__"]
extended-description = """
C headers, CMake package files and pkg-config files needed to build \
applications against Cyclone DDS and iceoryx."""
assets = [
    [
        "../iceoryx/install/include/**/*",
        "usr/include/",
        "644",
    ],
    [
        "../iceoryx/install/share/**/*",
        "usr/share/",
        "644",
    ],
    [
        "../cyclonedds/install/include/**/*",
        "usr/include/",
        "755",
    ],
    [
        "../cyclonedds/install/lib/cmake/**/*",
        "usr/lib/cmake/",
        "644",
    ],
    [
        "../cyclonedds/install/lib/pkgconfig/**/*",
        "usr/lib/pkgconfig/",
        "644",
    ],
]

[package.metadata.deb.variants.config]
name = "__PACKAGE_CONFIG_NAME__"
depends = ["__PACKAGE_NAME__"]
extended-description = """
Default Cyclone DDS configuration XML installed under /etc/cyclonedds."""
assets = [["../config/cyclonedds.xml", "etc/cyclonedds/", "644"]]
